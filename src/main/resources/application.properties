# =============================================================================
# application.properties — Base / Common Configuration
#
# This file contains settings that are IDENTICAL across all profiles.
# Profile-specific overrides live in:
#   application-dev.properties   (local development)
#   application-prod.properties  (production)
#
# Active profile is controlled by the SPRING_PROFILES_ACTIVE environment
# variable, or by spring.profiles.active below.  Defaults to "dev" so
# developers can run the app out-of-the-box without any env vars.
# =============================================================================

spring.application.name=hospital

# ── Default profile: dev ─────────────────────────────────────────────────────
# Override with:  SPRING_PROFILES_ACTIVE=prod  (Docker Compose / production)
spring.profiles.default=dev

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8081

# ── JPA common settings ──────────────────────────────────────────────────────
# DDL strategy and SQL logging are overridden per profile.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# jwt.secret MUST be overridden in each profile (no base default here).
# Expiration times are identical in all environments.
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ── File upload ──────────────────────────────────────────────────────────────
file.upload-dir=uploads
file.max-size=10485760

# ── Mail common settings ─────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Actuator ─────────────────────────────────────────────────────────────────
# Only health and info are exposed over HTTP.
# All other endpoints (beans, env, metrics, etc.) are disabled at the HTTP level.
# Security rules in SecurityConfig additionally require ADMIN for /actuator/**
# beyond the explicitly permitted /actuator/health and /actuator/info.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info

# Health details: overridden per profile (dev shows to authorized users; prod never)
management.endpoint.health.show-details=never

# ── Liveness & Readiness health groups (for container orchestration) ──────────
# Liveness:  /actuator/health/liveness  — is the JVM alive and not deadlocked?
# Readiness: /actuator/health/readiness — is the app ready to serve traffic?
# Docker Compose / Kubernetes can probe these individually.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false

# ── /actuator/info content ────────────────────────────────────────────────────
# App name and version shown in /info response.  No secrets here.
management.info.app.enabled=true
info.app.name=Hospital Management System
info.app.description=REST API for hospital operations management
info.app.version=1.0.0

# Disable env/java/os info contributors by default — profile overrides enable
# the safe ones in dev for debugging convenience.
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false