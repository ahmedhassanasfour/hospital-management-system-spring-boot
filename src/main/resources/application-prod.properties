# =============================================================================
# application-prod.properties — Production Profile
#
# Activated when:  SPRING_PROFILES_ACTIVE=prod
#
# ALL secrets are provided exclusively via environment variables.
# There are NO fallback defaults for any secret; a missing variable causes
# the application to fail at startup — this is intentional (fail-fast).
#
# Required environment variables (no defaults — app refuses to start without them):
#   DB_URL                    JDBC URL pointing to the production PostgreSQL
#   DB_USERNAME               Database login user
#   DB_PASSWORD               Database login password
#   JWT_SECRET                HS256 signing key (min 32 chars / 256 bits)
#   ADMIN_DEFAULT_PASSWORD    Initial admin password (change after first login)
#   WEBSOCKET_ALLOWED_ORIGINS Comma-separated list of frontend origins
#
# Optional (app starts without them — mail features are disabled):
#   MAIL_USERNAME             Gmail / SMTP username
#   MAIL_PASSWORD             Gmail / SMTP app password
#   REDIS_HOST                Redis hostname  (default: redis — Docker service name)
#   REDIS_PORT                Redis port      (default: 6379)
# =============================================================================

# ── Database — PostgreSQL with HikariCP connection pool ───────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool tuning
spring.datasource.hikari.pool-name=HospitalHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Disable SQL logging — prevents accidental data leakage in logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable statistics logging
spring.jpa.properties.hibernate.generate_statistics=false

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT — no default; fails fast if not provided ─────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Mail (optional — leave blank to disable) ──────────────────────────────────
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ── Admin seeder — no default; fails fast if not provided ────────────────────
admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# ── WebSocket — no default; fails fast if not provided ───────────────────────
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}

# ── Swagger / OpenAPI — disabled in production ───────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Logging ──────────────────────────────────────────────────────────────────
# No DEBUG or TRACE — avoids leaking tokens, passwords, or SQL data.
logging.level.root=WARN
logging.level.com.ahmed.hospital=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ── Actuator ─────────────────────────────────────────────────────────────────
# Only health and info are exposed (inherited from application.properties).
# This section explicitly hardens the production behaviour.

# Never show internal health component details in any HTTP response.
# The root /actuator/health response only returns {"status":"UP"} or {"status":"DOWN"}.
management.endpoint.health.show-details=never

# Sub-group endpoints (/actuator/health/liveness, /actuator/health/readiness)
# return only the status string — no component details exposed publicly.
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.readiness.show-details=never

# Disable all info contributors that could expose internal server information.
# - env:  would expose application properties / env vars (including secret names)
# - java: exposes JVM version, vendor, runtime details
# - os:   exposes operating system name and architecture
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

# The /actuator/info endpoint returns only the safe static info defined in
# application.properties (app name, description, version).
# No dynamic system or environment data is included.
