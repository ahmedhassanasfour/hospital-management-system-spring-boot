# =============================================================================
# application-dev.properties — Development Profile
#
# Activated when:  SPRING_PROFILES_ACTIVE=dev  (default when running locally)
#
# This file is safe to commit to source control because it contains NO real
# secrets.  All defaults here are intentionally weak/obvious — they exist only
# to let the app start without any local environment setup.
# =============================================================================

# ── Database (local Docker Compose on host port 5433) ────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ── SQL logging (dev only — never enable in production) ───────────────────────
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ── Redis (local) ────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT (dev-only default — NOT secure, only for local testing) ──────────────
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-key-at-least-32-chars-long}

# ── Mail (disabled by default in dev — start app without mail creds) ─────────
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ── Admin seeder ─────────────────────────────────────────────────────────────
admin.default-password=${ADMIN_DEFAULT_PASSWORD:ChangeMe@Local123}

# ── WebSocket ────────────────────────────────────────────────────────────────
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ── Swagger / OpenAPI (available in dev) ─────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# Sort operations alphabetically for easier navigation
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# Persist the authorization token across page reloads (dev convenience only)
springdoc.swagger-ui.persist-authorization=true
# Expand the first operation in each group by default
springdoc.swagger-ui.doc-expansion=none


# ── Logging (verbose for development) ────────────────────────────────────────
logging.level.root=INFO
logging.level.com.ahmed.hospital=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ── Actuator (dev overrides) ─────────────────────────────────────────────────
# Show full health details to authenticated users — useful for local debugging.
management.endpoint.health.show-details=when-authorized
# Show details on sub-group paths too:
#   GET /actuator/health/liveness   — probes livenessState
#   GET /actuator/health/readiness  — probes readinessState + db + redis
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.show-details=always
# Enable safe info contributors — no secrets, useful for local diagnostics.
management.info.java.enabled=true
management.info.os.enabled=true
